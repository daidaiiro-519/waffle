<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共有されたアーティファクト</title>
<style>
  :root{
    --ink:#1b2027; --ink-soft:#5b6472; --ink-faint:#65707b;
    --paper:#f4f2ee; --card:#ffffff; --line:#dcd8d0; --line-soft:#e9e5de;
    --accent:#2f5d63; --accent-soft:#e3edee;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, "Segoe UI", system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  :root[data-theme="dark"]{
    --ink:#e8e5df; --ink-soft:#a9b0ba; --ink-faint:#8b939d;
    --paper:#16191c; --card:#1f2327; --line:#343a3f; --line-soft:#2a2f34;
    --accent:#7fb3ba; --accent-soft:#1e2c2e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8e5df; --ink-soft:#a9b0ba; --ink-faint:#8b939d;
      --paper:#16191c; --card:#1f2327; --line:#343a3f; --line-soft:#2a2f34;
      --accent:#7fb3ba; --accent-soft:#1e2c2e;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); line-height:1.7;}
  .page{max-width:820px; margin:0 auto; padding:34px 22px 90px;}

  header{padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:26px;}
  h1{font-family:var(--serif); font-size:22px; font-weight:600; margin:0 0 5px; text-wrap:balance;}
  .count{font-size:12.5px; color:var(--ink-faint);}

  .list{border:1px solid var(--line); border-radius:12px; background:var(--card);}
  a.row{display:block; padding:15px 18px; border-top:1px solid var(--line-soft);
    text-decoration:none; color:inherit;}
  a.row:first-child{border-top:none; border-radius:12px 12px 0 0;}
  a.row:last-child{border-radius:0 0 12px 12px;}
  a.row:hover{background:var(--paper);}
  a.row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .title{font-size:14.5px; font-weight:600; margin:0 0 4px;}
  .desc{font-size:12.5px; color:var(--ink-soft); margin:0 0 6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .sub{display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    font-size:11.5px; color:var(--ink-faint);}
  .dtype{font-family:var(--mono); font-size:10px; letter-spacing:.03em; padding:2px 7px;
    border-radius:4px; background:var(--accent-soft); color:var(--accent);}

  .empty{padding:46px 24px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
  footer{margin-top:20px; font-size:11.5px; color:var(--ink-faint); line-height:1.8;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="name">共有されたアーティファクト</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="list" id="list">
    <div class="empty">読み込んでいます…</div>
  </div>

  <footer id="note"></footer>
</div>

<script>
(function () {
  'use strict';
  /* どのプロジェクトでも同じ雛形を置き、中身だけをここで読む。
     雛形を直したときは全プロジェクトへ置き直す。 */
  var PROJECT_ID = '{{プロジェクトID}}';
  var $ = function (id) { return document.getElementById(id); };

  function when(epoch) {
    if (!epoch) return '';
    var d = new Date(epoch * 1000);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' 更新';
  }

  function render(data) {
    if (data.name) {
      document.title = data.name;
      $('name').textContent = data.name;
    }
    var rows = data.artifacts || [];
    $('count').textContent = rows.length + ' 件';

    var list = $('list');
    list.textContent = '';
    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'まだ何も入っていません。';
      list.appendChild(e);
      return;
    }

    rows.forEach(function (a) {
      var row = document.createElement('a');
      row.className = 'row';
      row.href = '/p/' + a.artifactId + '/';

      var t = document.createElement('p');
      t.className = 'title';
      t.textContent = a.name;
      row.appendChild(t);

      if (a.description) {
        var d = document.createElement('p');
        d.className = 'desc';
        d.textContent = a.description;
        row.appendChild(d);
      }

      var sub = document.createElement('div');
      sub.className = 'sub';
      if (a.docType) {
        var ty = document.createElement('span');
        ty.className = 'dtype';
        ty.textContent = a.docType;
        sub.appendChild(ty);
      }
      var w = document.createElement('span');
      w.textContent = when(a.updatedAt);
      sub.appendChild(w);
      row.appendChild(sub);

      list.appendChild(row);
    });
  }

  fetch('/proj/' + PROJECT_ID + '/index.json', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      $('list').textContent = '';
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '中身を読み込めませんでした。開き直してみてください。';
      $('list').appendChild(e);
    });

  $('note').textContent =
    'それぞれを開くと、その場でコメントを残せます。名乗るだけでよく、登録は要りません。';
})();
</script>
</body>
</html>
