<!-- ══ プロジェクト ══ -->
<section class="view" id="v-projects">
  <div class="lhead">
    <h1>プロジェクト</h1>
    <span class="count" id="pcount"></span>
    <span class="scope">自分のものと、共有のものが並びます</span>
    <button class="btn" id="new-project" style="margin-left:auto;">新しいプロジェクト</button>
  </div>
  <div id="plist"></div>
</section>

<!-- ══ プロジェクトの中身 ══ -->
<section class="view" id="v-projdetail">
  <button class="back" type="button" id="pd-back">← プロジェクト一覧</button>

  <div class="dhead">
    <h1 id="pd-name"></h1>
    <span class="pkey" id="pd-key"></span>
    <span class="status on" id="pd-status">公開中</span>
    <span class="shared" id="pd-scope"></span>
  </div>

  <div class="sec">
    <h2>共有</h2>
    <div class="card sharebox">
      <div class="urlrow">
        <span class="u" id="pd-url"></span>
        <button class="copy" type="button" data-copy="pd-url">URLをコピー</button>
      </div>
      <div class="tokenline">
        <span class="tmask">••••-••••-••••</span>
        <span class="tnote">トークンは発行したときの一度しか表示されません。分からなくなった場合は再発行してください（それまでのトークンは使えなくなります）。</span>
        <button class="btn ghost sm" type="button" id="pd-rotate">閲覧トークンを再発行</button>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>入っているアーティファクト（<span id="pd-count"></span>）</h2>
    <div class="card" style="padding:0;" id="pd-arts"></div>
  </div>
</section>

<!-- ══ プロジェクトを作る ══ -->
<dialog id="dlg-newproj">
  <div class="dlg-pane on" id="np-1">
    <div class="dlg-head"><h2>新しいプロジェクト</h2>
      <p class="target">まとめて見せたいアーティファクトを入れる単位です</p></div>
    <div class="dlg-body">
      <div class="fld">
        <label for="np-name">表示名</label>
        <input id="np-name" type="text" placeholder="例: 検索基盤リニューアル">
      </div>
      <div class="fld">
        <label>プロジェクトの種類</label>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="np-scope" value="PERSONAL" checked>
            <span class="cbody">
              <span class="ct">個人</span>
              <span class="cs">アーティファクトを入れられるのは自分だけです。</span>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="np-scope" value="SHARED">
            <span class="cbody">
              <span class="ct">共有</span>
              <span class="cs">招かれた人なら誰でも、自分のアーティファクトを入れられます。他人のものは動かせません。</span>
            </span>
          </label>
        </div>
        <p class="note">あとから変更できません。</p>
      </div>
    </div>
    <div class="dlg-act">
      <button class="linkbtn" type="button" data-close>やめる</button>
      <button class="btn" type="button" id="np-go">作成する</button>
    </div>
  </div>

  <div class="dlg-pane" id="np-2">
    <div class="dlg-head"><h2>プロジェクトを作成しました</h2>
      <p class="target" id="np-name2"></p></div>
    <div class="dlg-body">
      <div class="urlrow" style="margin-bottom:12px;">
        <span class="u" id="np-url"></span>
        <button class="copy" type="button" data-copy="np-url">URLをコピー</button>
      </div>
      <div class="tokenbox" style="margin-bottom:13px;">
        <p class="tlabel">この画面を閉じると二度と表示できません</p>
        <div class="tval"><code id="np-token"></code>
          <button class="copy" type="button" data-copy="np-token">コピー</button></div>
      </div>
      <p>まだ中身は空です。アーティファクトを入れてから共有してください。</p>
    </div>
    <div class="dlg-act"><span class="spacer"></span>
      <button class="btn" type="button" data-close>閉じる</button></div>
  </div>
</dialog>
