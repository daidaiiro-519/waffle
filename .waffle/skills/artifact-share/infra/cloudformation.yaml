AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  artifact-share の配信環境。作った文書を渡した相手に見てもらい、その場で反応を
  受け取るための基盤。常時稼働する計算資源を持たず、要求のあった分だけ課金される
  構成にする。信頼の境界で配信の口を2つに分ける（認証が要る面と、閲覧の面）。

Parameters:
  BucketName:
    Type: String
    Description: アーティファクト・反応・索引を置くバケット名（全アカウントで一意）
  LogBucketName:
    Type: String
    Description: >-
      アクセスログを置くバケット名。本体とは別の資源にする。保持期間の要件が
      異なることと、事故のときに記録が本体と同じ権限で消せる状態を避けるため。
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: 配信の範囲。100=北米欧州のみ、200=+アジア、All=全リージョン
  LogRetentionDays:
    Type: Number
    Default: 90
    Description: アクセスログを保持する日数。過ぎたものは自動で削除される

Resources:

  # ── 保管 ───────────────────────────────────────────────

  # アーティファクト（p/{artifactId}/）・反応（comments/{artifactId}/）・索引（meta/）を置く。
  # 外部からの直接アクセスは一切許さず、配信の口と管理APIだけが触れる。
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # CORS は設定しない。反応の読み書きは配信の口自身からの同一の出所への
      # 要求だけで、別の出所からの要求を許す理由がない。

  # アクセスログ。本体と分ける理由は3つ。保持期間の要件が異なること、事故の
  # ときに記録が本体と同じ権限で消せる状態はフォレンジック上の基本違反であること、
  # 検査の漏れがあったときに書き込みが記録へ届く経路を同一の資源内に作らないこと。
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref LogBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred   # 配信の記録の書き込みに必要
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays

  # 配信の口が読めるのは全体、書けるのは反応の置き場だけ。削除は与えない。
  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ViewerDistributionRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ContentBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ViewerDistribution}"

          - Sid: ViewerDistributionListComments
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt ContentBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ViewerDistribution}"
              StringLike:
                s3:prefix: "comments/*"

          # 反応の記録だけを書ける。アーティファクトにも索引にも書けない。
          - Sid: ViewerDistributionPutCommentOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${ContentBucket.Arn}/comments/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ViewerDistribution}"

          # 認証が要る面は、アップロード画面を配るためだけに読む。
          - Sid: AdminDistributionRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ContentBucket.Arn}/admin/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}"

          # 管理APIが書けるのは、アーティファクト・索引・差し替えの区切りだけ。
          # 実行ロール側でも同じ範囲に絞り、二重にする。
          - Sid: AdminApiWriteScoped
            Effect: Allow
            Principal:
              AWS: !GetAtt AdminApiRole.Arn
            Action: s3:PutObject
            Resource:
              - !Sub "${ContentBucket.Arn}/p/*"
              - !Sub "${ContentBucket.Arn}/meta/*"
              - !Sub "${ContentBucket.Arn}/comments/*/*-replaced.json"
              - !Sub "${ContentBucket.Arn}/projects/*"
              - !Sub "${ContentBucket.Arn}/proj/*/index.json"
              - !Sub "${ContentBucket.Arn}/proj/*/index.html"

          # 管理APIが閲覧者の反応そのものへ書き込む経路を、資源の側でも塞ぐ。
          # 区切りの記録だけは許し、それ以外の反応には手を出させない。
          - Sid: AdminApiDenyElsewhere
            Effect: Deny
            Principal:
              AWS: !GetAtt AdminApiRole.Arn
            Action:
              - s3:PutObject
              - s3:DeleteObject
            NotResource:
              - !Sub "${ContentBucket.Arn}/p/*"
              - !Sub "${ContentBucket.Arn}/meta/*"
              - !Sub "${ContentBucket.Arn}/comments/*/*-replaced.json"
              - !Sub "${ContentBucket.Arn}/projects/*"
              - !Sub "${ContentBucket.Arn}/proj/*/index.json"
              - !Sub "${ContentBucket.Arn}/proj/*/index.html"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── トークンの保管 ─────────────────────────────────────────

  # token:{artifactId} / proj:{pid} / pp:{artifactId} を持つ。
  # トークンの記録は "{値}|{期限のエポック秒}|{世代番号}" の形で保存する。
  # 期限切れと世代違いは閲覧ゲートがその場で失効させるため、書き換えを待たずに効く。
  # 書き手は管理APIひとつに限り、閲覧ゲートは読むだけ。
  TokenStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub "${AWS::StackName}-tokens"
      Comment: "view keys with expiry and generation"

  # ── 認証（招待された者だけが公開できる） ──────────────────

  # 自分で登録する経路は開けない。責任者が招いた者だけが入れる。
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-publishers"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true     # 自分で登録する経路を閉じる
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # 合言葉を忘れたときは、確認済みのメールだけを頼りにする。
      # 招待に応じていない人はこの経路を使えないため、その場合は
      # 管理者が招き直す（管理APIの resend-invite）
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # 管理者。全員の共有アーティファクトを一覧・公開停止・再発行でき、
  # 投稿者を招いたり外したりできる。他人の中身の差し替えだけはできない。
  # 管理APIはこのグループが証明に含まれるかだけを見て、名簿を引き直さない。
  AdministratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: administrators
      UserPoolId: !Ref UserPool
      Description: 全員の共有アーティファクトを手入れでき、投稿者を出し入れできる

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-upload-app"
      GenerateSecret: false                # ブラウザから使うため秘密を持たせない
      # 管理画面が自前のフォームで受け取り、そのまま利用者プールへ渡す。
      # 初回の合言葉の付け替えも自前の画面で扱う（RespondToAuthChallenge）
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # 招かれていない宛先を入れても、招かれている宛先と同じ拒み方をする。
      # 拒み方の違いから、誰が招かれているかを外から探れないようにするため
      PreventUserExistenceErrors: ENABLED
      # 締め出しを防ぐため、入り直せる期間は長めに取る
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ── 管理API ───────────────────────────────────────

  # 権限は接頭辞と資源の単位まで絞る。反応にも記録にも書けない。削除も持たない。
  AdminApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: admin-api-scoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteArtifactAndIndexOnly
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/p/*"
                  - !Sub "arn:aws:s3:::${BucketName}/meta/*"
                  - !Sub "arn:aws:s3:::${BucketName}/projects/*"
              - Sid: ReadIndexForListing
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/meta/*"
                  - !Sub "arn:aws:s3:::${BucketName}/projects/*"
              # 投稿者が自分へ寄せられたコメントを読むため、および中身を
              # 手元へ取り出すため。読むだけで、書き込みは広げない
              - Sid: ReadCommentsAndContent
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/comments/*"
                  - !Sub "arn:aws:s3:::${BucketName}/p/*"
              # 索引を並べるためだけの走査。中身の置き場は対象にしない
              - Sid: ListIndexOnly
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketName}"
                Condition:
                  StringLike:
                    s3:prefix: ["meta/*", "projects/*", "comments/*"]
              # 一覧ページは閲覧の面が配る場所。任意のページを置けないよう、
              # 置ける名前を雛形と中身の2つに限る
              - Sid: WriteProjectListing
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/proj/*/index.json"
                  - !Sub "arn:aws:s3:::${BucketName}/proj/*/index.html"
              # 差し替えの区切りは反応の並びに載るため、そこへも書く。
              # 書けるのは区切りの記録だけで、閲覧者の反応そのものには触れない
              - Sid: WriteReplacementDivider
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BucketName}/comments/*/*-replaced.json"
              # トークンの保管は、この資源ひとつに限定する
              - Sid: WriteViewKeys
                Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:PutKey
                  - cloudfront-keyvaluestore:DeleteKey
                Resource: !GetAtt TokenStore.Arn
              # 招待と、外すこと。この利用者プールひとつに限る。
              # グループの付け替えは含めない（管理者を増やすのは、環境を
              # 用意した責任者がAWSの権限で行う操作として残す）
              - Sid: ManagePublishers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                Resource: !GetAtt UserPool.Arn
              - Sid: OwnLogsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-admin-api*"

  AdminApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-api"
      Role: !GetAtt AdminApiRole.Arn
      Runtime: python3.12
      Handler: main.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          CONTENT_BUCKET: !Ref BucketName
          KVS_ARN: !GetAtt TokenStore.Arn
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          VIEWER_DOMAIN: !GetAtt ViewerDistribution.DomainName
      # 実体は lambda/admin_api/ 配下。作成後に配置し直す。
      # ここに置くのは、置き換え前に誤って使われないための最小の管理API。
      Code:
        ZipFile: |
          def handler(event, context):
              return {
                  "statusCode": 503,
                  "headers": {"content-type": "application/json"},
                  "body": '{"error":"NOT_DEPLOYED",'
                          '"message":"artifactshare update-function を実行してください"}',
              }

  AdminApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AdminApiFunction.Arn
      AuthType: NONE          # 呼び出し元の確認は関数内で利用者の証明を検証して行う
      Cors:
        AllowOrigins:
          - !Sub "https://${AdminDistribution.DomainName}"
        AllowMethods: [POST]
        AllowHeaders: [content-type, authorization]
        MaxAge: 300

  AdminApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── 配信の共通設定 ─────────────────────────────────────

  ViewerTokenGateFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-token-gate"
      AutoPublish: true
      FunctionConfig:
        Comment: "view key check (expiry and generation) + write guard"
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt TokenStore.Arn
      # 実体は infra/cloudfront-function/viewer-token-gate.js。作成後に配置し直す。
      # このまま公開すると全ての閲覧が止まるため、必ず配置を済ませること。
      FunctionCode: |
        function handler(event) {
          return { statusCode: 503, statusDescription: 'Service Unavailable',
                   body: 'viewer-token-gate.js is not deployed yet.' };
        }

  # 反応の書き込みを保管へ通すための転送設定。
  # x-amz-content-sha256 は署名時に扱われるためここに含めない（含めると拒否される）。
  # 上書きしない宣言（if-none-match）は保管側が解釈するため転送する。
  CommentPutOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-comment-put"
        Comment: "forward content-type and if-none-match for comment writes"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [content-type, if-none-match]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: none }

  CachePolicyNoCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-no-cache"
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # 持ち込まれたアーティファクトに外部への到達を許さない。これにより、契約の「自己完結」が
  # 規約ではなく配信時の振る舞いとして効く。あわせて sandbox をヘッダー側でも
  # 指定し、閲覧画面の1行が失われても隔離が残るよう二重にする。
  ArtifactResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-artifact-headers"
        Comment: "enforce self-contained content and isolation"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: SAMEORIGIN, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none';
              img-src 'self' data:;
              style-src 'self' 'unsafe-inline';
              font-src 'self' data:;
              script-src 'self' 'unsafe-inline';
              connect-src 'self';
              frame-src 'self';
              form-action 'none';
              base-uri 'none';
              sandbox allow-scripts allow-top-navigation-by-user-activation

  # 認証が要る面。持ち込まれたアーティファクトを配らないため、隔離のための指定は持たない。
  AdminResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-admin-headers"
        Comment: "headers for the authenticated surface"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: same-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          # 管理画面から出ていける先を、利用者プールと管理APIの2つに限る。
          # ここが緩いと、持ち込まれた命令が証明を外へ運び出せる。
          # 管理APIの居場所を名指しできないのは、その居場所がこの面自身に
          # 依存しており、名指しすると資源どうしが互いを待って作れなくなるため。
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'none';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data:;
              font-src 'self' data:;
              connect-src 'self'
                https://cognito-idp.${AWS::Region}.amazonaws.com
                https://*.lambda-url.${AWS::Region}.on.aws;
              form-action 'none';
              base-uri 'none';
              frame-ancestors 'none'

  # ── 配信の口（信頼の境界で2つに分ける） ────────────────

  # 閲覧の面。持ち込まれたアーティファクト・反応・まとめの一覧を配る。
  # 認証が要る面と出所が分かれるため、ここで動く命令は認証の資格に手が届かない。
  ViewerDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} viewer surface"
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        DefaultRootObject: ""
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: viewer/
          IncludeCookies: false
        Origins:
          - Id: content-s3
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: content-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref CachePolicyNoCache
          ResponseHeadersPolicyId: !Ref ArtifactResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerTokenGateFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: "comments/*"
            TargetOriginId: content-s3
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: !Ref CachePolicyNoCache
            ResponseHeadersPolicyId: !Ref ArtifactResponseHeadersPolicy
            OriginRequestPolicyId: !Ref CommentPutOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerTokenGateFunction.FunctionMetadata.FunctionARN
          - PathPattern: "comments-list/*"
            TargetOriginId: content-s3
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref CachePolicyNoCache
            ResponseHeadersPolicyId: !Ref ArtifactResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerTokenGateFunction.FunctionMetadata.FunctionARN

  # 認証が要る面。招かれた者が公開と管理を行う画面だけを配る。
  # 閲覧の面とは出所が分かれるため、持ち込まれた命令からは到達できない。
  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} authenticated surface"
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: admin/
          IncludeCookies: false
        Origins:
          - Id: admin-s3
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            OriginPath: /admin
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: admin-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref CachePolicyNoCache
          ResponseHeadersPolicyId: !Ref AdminResponseHeadersPolicy

Outputs:
  ViewerDomain:
    Description: 閲覧者へ渡すURLの土台（閲覧の面）
    Value: !GetAtt ViewerDistribution.DomainName
  AdminDomain:
    Description: 招かれた者が公開・管理を行う画面（認証が要る面）
    Value: !GetAtt AdminDistribution.DomainName
  ViewerDistributionId:
    Value: !Ref ViewerDistribution
  AdminDistributionId:
    Value: !Ref AdminDistribution
  BucketNameOut:
    Description: アーティファクト・反応・索引の置き場
    Value: !Ref ContentBucket
  LogBucketNameOut:
    Description: アクセスのアクセスログの置き場（本体とは別の資源）
    Value: !Ref LogBucket
  TokenStoreArn:
    Value: !GetAtt TokenStore.Arn
  ViewerTokenGateFunctionName:
    Description: 作成後に infra/cloudfront-function/viewer-token-gate.js を配置する対象
    Value: !Sub "${AWS::StackName}-viewer-token-gate"
  AdminApiFunctionName:
    Description: artifactshare update-function が lambda/admin_api/ を配置する対象
    Value: !Sub "${AWS::StackName}-admin-api"
  AdminApiUrl:
