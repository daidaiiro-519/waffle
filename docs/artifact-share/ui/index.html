<title>artifactshare — 画面のモック</title>
<style>
  :root{
    --ink:#1b2027; --ink-soft:#5b6472; --ink-faint:#65707b;
    --paper:#f4f2ee; --card:#ffffff; --line:#dcd8d0; --line-soft:#e9e5de;
    --accent:#2f5d63; --accent-soft:#e3edee;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --ink:#e8e5df; --ink-soft:#a9b0ba; --ink-faint:#8b939d;
    --paper:#16191c; --card:#1f2327; --line:#343a3f; --line-soft:#2a2f34;
    --accent:#7fb3ba; --accent-soft:#1e2c2e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8e5df; --ink-soft:#a9b0ba; --ink-faint:#8b939d;
      --paper:#16191c; --card:#1f2327; --line:#343a3f; --line-soft:#2a2f34;
      --accent:#7fb3ba; --accent-soft:#1e2c2e;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.7;}
  .shell{max-width:1180px; margin:0 auto; padding:30px 22px 60px;}

  header.top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .brand{font-family:var(--serif); font-size:20px; font-weight:600;}
  .brand span{color:var(--accent);}
  .top p{margin:0; font-size:12.5px; color:var(--ink-faint);}

  .picker{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px;}
  .picker button{font:inherit; font-size:13px; padding:7px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); display:inline-flex; gap:8px; align-items:center;}
  .picker button:hover{border-color:var(--accent); color:var(--accent);}
  .picker button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);
    color:var(--accent); font-weight:600;}
  .picker .role{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; padding:2px 6px;
    border-radius:4px; background:var(--line-soft); color:var(--ink-faint);}
  .picker button[aria-pressed="true"] .role{background:var(--card); color:var(--accent);}
  .picker button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .lede{margin:0 0 14px; font-size:13px; color:var(--ink-soft); max-width:64ch; min-height:2.6em;}

  .frame{border:1px solid var(--line); border-radius:13px; background:var(--card); overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .frame .bar{display:flex; align-items:center; gap:8px; padding:9px 14px;
    border-bottom:1px solid var(--line-soft); background:var(--paper);}
  .frame .dots{display:flex; gap:5px;}
  .frame .dots i{width:9px; height:9px; border-radius:50%; background:var(--line); display:block;}
  .frame .addr{font-family:var(--mono); font-size:11px; color:var(--ink-faint);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .frame .open{margin-left:auto; font:inherit; font-size:11.5px; color:var(--ink-soft);
    background:none; border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer;}
  .frame .open:hover{border-color:var(--accent); color:var(--accent);}
  iframe{display:block; width:100%; height:min(76vh, 900px); border:0; background:var(--card);}

  footer{margin-top:22px; font-size:12px; color:var(--ink-faint); line-height:1.8;}
  footer code{font-family:var(--mono); font-size:11px; background:var(--line-soft); padding:1px 5px; border-radius:4px;}

  @media (max-width:640px){
    .picker button{flex:1 1 auto; justify-content:center;}
    iframe{height:min(70vh, 620px);}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">artifact<span>share</span></div>
    <p>画面のモック — 5面</p>
  </header>

  <div class="picker" id="picker" role="group" aria-label="画面を選ぶ">
      <button type="button" data-key="main" aria-pressed="false">アーティファクト<span class="role">投稿者</span></button>
      <button type="button" data-key="project" aria-pressed="false">プロジェクト<span class="role">投稿者</span></button>
      <button type="button" data-key="admin" aria-pressed="false">管理者<span class="role">管理者</span></button>
      <button type="button" data-key="viewer" aria-pressed="false">トークンの入力<span class="role">閲覧者</span></button>
      <button type="button" data-key="viewing" aria-pressed="false">閲覧とコメント<span class="role">閲覧者</span></button>
  </div>

  <p class="lede" id="lede"></p>

  <div class="frame">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="addr" id="addr"></span>
      <button type="button" class="open" id="open">別のタブで開く</button>
    </div>
    <iframe id="stage" title="画面のモック"></iframe>
  </div>

  <footer>
    どの画面も実際に動きます。値はモック用の作り物で、外部への通信はありません。
    元のファイルは <code>docs/artifact-share/ui/</code> にあります。
  </footer>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var current = null, url = null;

  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function show(key) {
    var s = SCREENS.filter(function (x) { return x.key === key; })[0];
    if (!s) return;
    current = key;
    $('lede').textContent = s.note;
    $('addr').textContent = s.addr;
    $('stage').setAttribute('title', s.label + 'の画面');
    $('stage').srcdoc = decode(DATA[key]);

    if (url) { URL.revokeObjectURL(url); url = null; }
    document.querySelectorAll('#picker button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.key === key));
    });
    if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
  }

  document.querySelectorAll('#picker button').forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.key); });
  });

  $('open').addEventListener('click', function () {
    var blob = new Blob([decode(DATA[current])], { type: 'text/html' });
    url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  });

  window.addEventListener('hashchange', function () {
    var key = location.hash.slice(1);
    if (key && key !== current) show(key);
  });

  show(location.hash.slice(1) || SCREENS[0].key);
